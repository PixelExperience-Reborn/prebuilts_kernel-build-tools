name: Android17 kernel build-tools source-only audit

on:
  push:
    branches:
      - audit/a17-kernel-build-tools-source-20261106
    paths:
      - 'audit/check_kernel_build_tools_source.py'
      - 'docs/ANDROID_17_KERNEL_BUILD_TOOLS_AUDIT.md'
      - '.github/workflows/a17-kernel-build-tools-source.yml'
  pull_request:
    paths:
      - 'audit/check_kernel_build_tools_source.py'
      - 'docs/ANDROID_17_KERNEL_BUILD_TOOLS_AUDIT.md'
      - '.github/workflows/a17-kernel-build-tools-source.yml'

permissions:
  contents: read

jobs:
  verify-host-tool-source-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout only audit code and historical text manifests
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            audit/
            docs/
            .github/workflows/
            BUILD.bazel
            OWNERS
            build-prebuilts.sh
            manifest.xml
            update-prebuilts.sh
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch historic Git commit metadata, not 130 MB prebuilts
        run: |
          git fetch --quiet --no-tags --filter=blob:none --depth=1 origin \
            +refs/heads/seventeen:refs/remotes/origin/seventeen
      - name: Obtain exact immutable GitHub Git-tree metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/PixelExperience-Reborn/prebuilts_kernel-build-tools/git/trees/aa62325a8144238dfe666777580b08b6cd8db875?recursive=1" \
            -o "$RUNNER_TEMP/old-kernel-tools-tree.json"
      - name: Checkout reviewed AOSP17 source manifest
        run: |
          git clone -q --depth=1 \
            --branch port/a17-aosp17-manifest-20261102 \
            https://github.com/PixelExperience-Reborn/manifest.git \
            "$RUNNER_TEMP/manifest"
      - name: Check exact old source metadata and Android17 owners
        run: |
          python3 audit/check_kernel_build_tools_source.py \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/old-kernel-tools-tree.json" \
            "$RUNNER_TEMP/manifest"
      - name: Compare contemporary official kernel tool repository layout read-only
        run: |
          curl --fail --silent --show-error --location \
            "https://android.googlesource.com/kernel/prebuilts/build-tools/+/refs/heads/main-kernel/?format=JSON" \
            -o "$RUNNER_TEMP/official-kernel-tools.json"
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os

          path = Path(os.environ["RUNNER_TEMP"]) / "official-kernel-tools.json"
          payload = path.read_text(encoding="utf-8")
          if payload.startswith(")]}'"):
              payload = payload.split("\n", 1)[1]
          obj = json.loads(payload)
          entries = {e["name"] for e in obj.get("entries", [])}
          assert {"bazel", "linux_musl-x86", "sysroots", "BUILD.bazel"}.issubset(entries), entries
          assert "linux-x86" not in entries, "old layout restored; re-audit the official kernel build tools"
          print("PASS: official kernel main-kernel has distinct modern Bazel/musl/sysroots layout")
          print("OBSERVATION ONLY: this rolling kernel ref is not selected into AOSP17")
          PY
      - name: Run Android17 manifest regression checks
        run: |
          cd "$RUNNER_TEMP/manifest"
          python3 -m unittest discover -s tools \
            -p 'test_aosp17_manifest_entrypoint.py' -v
      - name: Resolve actual AOSP17 default.xml with the official repo parser
        run: |
          curl --fail --silent --show-error --location \
            "https://storage.googleapis.com/git-repo-downloads/repo" \
            -o "$RUNNER_TEMP/repo"
          chmod +x "$RUNNER_TEMP/repo"
          mkdir -p "$RUNNER_TEMP/repo-graph"
          cd "$RUNNER_TEMP/repo-graph"
          "$RUNNER_TEMP/repo" init -q --no-clone-bundle \
            -u https://github.com/PixelExperience-Reborn/manifest \
            -b port/a17-aosp17-manifest-20261102 -m default.xml
          "$RUNNER_TEMP/repo" manifest -o "$RUNNER_TEMP/effective.xml"
          python3 - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse(Path(os.environ["RUNNER_TEMP"]) / "effective.xml").getroot()
          projects = root.findall(".//project")
          owners = {p.get("path") or p.get("name"): p.get("name") for p in projects}
          assert len(projects) == 1069 and len(owners) == 1069, "incorrect or duplicate source owner"
          assert "prebuilts/kernel-build-tools" not in owners, "legacy host bundle reimported"
          assert "prebuilts_kernel-build-tools" not in owners.values(), "legacy PE kernel tool owner reimported"
          for path, official in {
              "prebuilts/build-tools": "platform/prebuilts/build-tools",
              "prebuilts/tools": "platform/prebuilts/tools",
              "prebuilts/clang/host/linux-x86": "platform/prebuilts/clang/host/linux-x86",
              "system/tools/mkbootimg": "platform/system/tools/mkbootimg",
          }.items():
              assert owners[path] == official, f"wrong official AOSP17 owner: {path}"
          print("PASS: official repo manifest selects 1069 distinct Android17 projects")
          print("PASS: old kernel host-tool project excluded and modern platform owners retained")
          PY
      - name: Explicit scope
        run: |
          echo "SOURCE-ONLY: manifest and immutable Git metadata, no binary execution."
          echo "NOT TESTED: host binary ABI, modern kernel toolchain, device Soong/VINTF/SELinux, mondrian boot."
